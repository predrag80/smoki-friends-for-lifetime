#cloud-config
# First-boot setup for the Hetzner server. Paste into "Cloud config" when creating the server,
# after replacing __DEPLOY_PUBLIC_KEY__ with the content of ~/.ssh/sffl_deploy.pub.
# Installs Docker, creates the "deploy" user used by GitHub Actions and enables the firewall.
# Secrets are generated later on the server by deploy/hetzner/init-env.sh (first deploy).

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - rsync
  - ufw
  - fail2ban
  - openssl
  - unattended-upgrades

users:
  - default
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __DEPLOY_PUBLIC_KEY__

ssh_pwauth: false

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - mkdir -p /opt/sffl/app
  - chown -R deploy:deploy /opt/sffl
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
