name: Deploy (Hetzner dev)

# Runs after CI succeeds for a push to main, or manually from the Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      DEPLOY_USER: deploy
      DEPLOY_PATH: /opt/sffl/app
      APP_DOMAIN: ${{ vars.APP_DOMAIN || 'smoki-dev.prowebsystems.rs' }}
      API_DOMAIN: ${{ vars.API_DOMAIN || 'api.smoki-dev.prowebsystems.rs' }}
      MAIL_DOMAIN: ${{ vars.MAIL_DOMAIN || 'mail.smoki-dev.prowebsystems.rs' }}

    steps:
      - name: Check configuration
        id: config
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "$HETZNER_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::HETZNER_HOST variable or HETZNER_SSH_KEY secret is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Normalise line endings and make sure the key ends with a newline.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! head -1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN'; then
            echo "::error::HETZNER_SSH_KEY must be the PRIVATE key (content of ~/.ssh/sffl_deploy, starting with -----BEGIN OPENSSH PRIVATE KEY-----)."
            exit 1
          fi
          # Fingerprint only (not secret): compare with `ssh-keygen -lf ~/.ssh/sffl_deploy.pub` locally.
          echo "::notice::Deploy key fingerprint: $(ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -lf - | awk '{print $2}')"
          HOST="$(printf '%s' "$HETZNER_HOST" | tr -d '[:space:]')"
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n  ServerAliveInterval 30\n' \
            "$HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Test SSH connection
        if: steps.config.outputs.ready == 'true'
        run: |
          if ! ssh server 'echo "Connected as $(whoami) to $(hostname)"; docker --version'; then
            echo "::group::SSH debug output"
            DEBUG="$(ssh -vv server true 2>&1 | grep -E "Connecting to|Connection (established|refused|timed out)|Offering|Authenticated|Permission denied|No route|Host key" | sed 's/^debug[0-9]*: //' | tr '\n' ' ' | cut -c1-900)"
            echo "$DEBUG"
            echo "::endgroup::"
            echo "::warning::SSH debug: $DEBUG"
            echo "::error::SSH to $DEPLOY_USER@HETZNER_HOST failed. Check the HETZNER_HOST variable and that HETZNER_SSH_KEY matches ~/.ssh/sffl_deploy."
            exit 1
          fi

      - name: Upload code
        if: steps.config.outputs.ready == 'true'
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '*.tsbuildinfo' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'storage' \
            ./ server:"$DEPLOY_PATH"/

      - name: Build, migrate and restart
        if: steps.config.outputs.ready == 'true'
        run: |
          ssh server "APP_DOMAIN='$APP_DOMAIN' API_DOMAIN='$API_DOMAIN' MAIL_DOMAIN='$MAIL_DOMAIN' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          bash deploy/hetzner/init-env.sh
          COMPOSE="docker compose -f deploy/docker-compose.prod.yml --env-file /opt/sffl/.env.production"
          $COMPOSE build
          $COMPOSE up -d postgres valkey storage-perms storage storage-init mailpit
          $COMPOSE run --rm migrate
          $COMPOSE up -d --remove-orphans backend worker frontend caddy
          $COMPOSE ps
          docker image prune -f
          SCRIPT

      - name: Check health
        if: steps.config.outputs.ready == 'true'
        run: |
          for i in $(seq 1 20); do
            if ssh server "docker compose -f $DEPLOY_PATH/deploy/docker-compose.prod.yml --env-file /opt/sffl/.env.production exec -T backend wget -qO- http://localhost:4100/health"; then
              echo; echo "API is healthy"; exit 0
            fi
            sleep 6
          done
          echo "::error::API health check failed"
          exit 1
