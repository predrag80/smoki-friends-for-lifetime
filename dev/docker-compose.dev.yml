# Local development services. Run from the repo root: npm run dev:services
# Next.js and Fastify run on the host (npm run dev:frontend / dev:backend);
# Caddy routes app.smoki.local and api.smoki.local to them.
name: sffl-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sffl
      POSTGRES_USER: sffl
      POSTGRES_PASSWORD: sffl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sffl -d sffl"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sffl
      MINIO_ROOT_PASSWORD: sffl-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the private bucket once MinIO is up. No anonymous access.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sffl sffl-secret &&
      mc mb --ignore-existing local/sffl-private &&
      mc anonymous set none local/sffl-private
      "
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    # host.docker.internal is provided by Colima and OrbStack and points to the Mac.
    # Do not override it with host-gateway: under Colima that resolves to the VM, not the Mac.

volumes:
  postgres_data:
  valkey_data:
  minio_data:
  caddy_data:
