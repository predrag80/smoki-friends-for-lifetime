# Local development services. Run from the repo root: npm run dev:services
# Next.js and Fastify run on the host (npm run dev). app.smoki.local and
# api.smoki.local are routed by the local nginx (dev/nginx/smoki.local.conf),
# or by the optional Caddy service (profile "proxy").
name: sffl-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sffl
      POSTGRES_USER: sffl
      POSTGRES_PASSWORD: sffl
    ports:
      # 5433 on the host so it never collides with a locally installed Postgres
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sffl -d sffl"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      # 6380 on the host so it never collides with a locally installed Redis
      - "6380:6379"
    volumes:
      - valkey_data:/data

  # Local S3-compatible storage (RustFS). MinIO community images are no longer published.
  # The container runs as uid 10001, so the volume is chowned first.
  storage-perms:
    image: alpine:3
    command: chown -R 10001:10001 /data
    volumes:
      - storage_data:/data
    restart: "no"

  storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    depends_on:
      storage-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: SFFLDEVACCESSKEY
      RUSTFS_SECRET_KEY: sffl-dev-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

  # Creates the private bucket once storage is reachable. No public access.
  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: SFFLDEVACCESSKEY
      AWS_SECRET_ACCESS_KEY: sffl-dev-secret-key
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://storage:9000 s3api list-buckets >/dev/null 2>&1 && break
          sleep 1
        done
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket sffl-private 2>/dev/null \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket sffl-private
    restart: "no"

  # Optional: only for machines without a local web server on port 80.
  # Start with: docker compose -f dev/docker-compose.dev.yml --profile proxy up -d
  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    # host.docker.internal is provided by OrbStack and points to the Mac.
    # Do not override it with host-gateway (under some engines it resolves to the VM).

volumes:
  postgres_data:
  valkey_data:
  storage_data:
  caddy_data:
