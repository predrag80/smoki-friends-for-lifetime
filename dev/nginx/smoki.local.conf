# Local nginx vhosts for Smoki Friend for a Lifetime.
# Homebrew nginx: copy to $(brew --prefix)/etc/nginx/servers/ and reload nginx.

map $http_upgrade $sffl_connection_upgrade {
    default upgrade;
    ''      close;
}

# Next.js dev server
server {
    listen 127.0.0.1:80;
    server_name app.smoki.local;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Hot reload websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sffl_connection_upgrade;
    }
}

# Fastify API
server {
    listen 127.0.0.1:80;
    server_name api.smoki.local;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
